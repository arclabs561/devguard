name: devguard-self-scan
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install quality dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes just
          uv sync --locked --all-extras
      - name: Run canonical quality checks
        run: just quality
      - name: Build and check distribution archives
        run: |
          uv build
          uv run --no-project python -m devguard._release_artifacts dist
  devguard-sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Install OSV-Scanner
        env:
          OSV_VERSION: v2.7.1
          OSV_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location \
            "https://github.com/google/osv-scanner/releases/download/$OSV_VERSION/osv-scanner_linux_amd64" -o osv-scanner
          echo "$OSV_SHA256  osv-scanner" | sha256sum --check
          chmod +x osv-scanner
          mkdir -p devguard-bin
          mv osv-scanner devguard-bin/
          echo "$RUNNER_TEMP/devguard-bin" >> "$GITHUB_PATH"
      - name: Run devguard sweep
        run: |
          status=0
          uv run --locked devguard sweep --repo . --only local_dev,gitignore_audit,dependency_audit,ai_editor_config_audit,publish_workflow_audit,repo_hygiene --format sarif > devguard-results.sarif || status=$?
          # Findings are uploaded to code scanning. An incomplete scan must fail CI.
          case "$status" in 0|2) ;; *) exit "$status" ;; esac
          jq -e '.runs | type == "array" and length > 0' devguard-results.sarif > /dev/null
      - name: Check for high-severity workflow findings
        run: uv run --locked devguard fleet . --only publish_workflow_audit --no-cache --fail-on high
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3.37.0
        with:
          sarif_file: devguard-results.sarif
          category: devguard
  trufflehog:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          extra_args: --results=verified,unknown
